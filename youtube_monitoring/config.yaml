name: "YouTube Monitoring Dev"
version: "1.6.0-dev.1"
slug: "youtube_monitoring_dev"
description: "YouTube cookie-based watch history, subscriptions & recommended videos + MQTT Discovery sensors (auto cookie refresh)."
url: "https://github.com/Davst/youtube_monitoring_addon"
icon: "icon.png"
logo: "logo.png"
panel_icon: "mdi:youtube-subscription"
panel_title: "YouTube Watch History"
panel_admin: true
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
ports:
  8765/tcp: null
ports_description:
  8765/tcp: "YouTube History API Web Server"
homeassistant_api: true
ingress: true
ingress_port: 8765
map:
  - config:ro
services:
  - "mqtt:want"
options:
  cookies_path: "/data/youtube_cookies.txt"
  scan_interval: 60
  port: 8765
  duplicate_minutes: 5
  fetch_recommended: true
  scan_interval_recommended: 1800
  timezone: "Europe/Stockholm"
  notify_cookie_invalid: true
  scan_all_channels: true
schema:
  cookies_path: "str"
  scan_interval: "int(30,300)?"
  port: "int(1024,65535)?"
  duplicate_minutes: "int(1,60)?"
  fetch_recommended: "bool?"
  scan_interval_recommended: "int(60,3600)?"
  timezone: "str?"
  notify_cookie_invalid: "bool?"
  scan_all_channels: "bool?"
